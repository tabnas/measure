name: Record historical measurement

on:
  workflow_dispatch:
  repository_dispatch:
    types: [parser-release]

permissions:
  contents: write

concurrency:
  group: record-measurement
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: npm ci
      - run: GOWORK=off go mod download
      - run: npm test
      - run: npm run measure
      - name: Commit immutable run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results site/data/catalog.json site/data/history.json
          git commit -m "data: record Tabnas measurement"
          git push origin HEAD:main
